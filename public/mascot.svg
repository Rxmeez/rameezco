<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Body -->
  <rect x="20" y="55" width="60" height="35" rx="12" fill="none" stroke="currentColor" stroke-width="3"/>
  
  <!-- Head -->
  <rect x="25" y="15" width="50" height="45" rx="14" fill="none" stroke="currentColor" stroke-width="3"/>
  
  <!-- Left ear / antenna -->
  <rect x="18" y="8" width="12" height="18" rx="6" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <circle cx="24" cy="6" r="3" fill="currentColor"/>
  
  <!-- Right ear / antenna -->
  <rect x="70" y="8" width="12" height="18" rx="6" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <circle cx="76" cy="6" r="3" fill="currentColor"/>
  
  <!-- Eyes -->
  <circle cx="38" cy="38" r="4" fill="currentColor"/>
  <circle cx="62" cy="38" r="4" fill="currentColor"/>
  
  <!-- Blush / cheeks -->
  <circle cx="32" cy="46" r="2.5" fill="var(--accent, #ff6b2b)" opacity="0.6"/>
  <circle cx="68" cy="46" r="2.5" fill="var(--accent, #ff6b2b)" opacity="0.6"/>
  
  <!-- Mouth (small smile) -->
  <path d="M 45 48 Q 50 52 55 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Screen on body -->
  <rect x="30" y="62" width="40" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="34" y1="68" x2="66" y2="68" stroke="currentColor" stroke-width="1.5"/>
  <line x1="34" y1="74" x2="58" y2="74" stroke="currentColor" stroke-width="1.5"/>
</svg>
