<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Body -->
  <rect x="20" y="55" width="60" height="35" rx="12" fill="none" stroke="currentColor" stroke-width="3"/>
  
  <!-- Head -->
  <rect x="25" y="15" width="50" height="45" rx="14" fill="none" stroke="currentColor" stroke-width="3"/>
  
  <!-- Left ear / antenna (tilted) -->
  <rect x="16" y="5" width="12" height="18" rx="6" fill="none" stroke="currentColor" stroke-width="2.5" transform="rotate(-15 22 14)"/>
  <circle cx="20" cy="4" r="3" fill="var(--accent, #ff6b2b)"/>
  
  <!-- Right ear / antenna (tilted) -->
  <rect x="72" y="5" width="12" height="18" rx="6" fill="none" stroke="currentColor" stroke-width="2.5" transform="rotate(15 78 14)"/>
  <circle cx="80" cy="4" r="3" fill="var(--accent, #ff6b2b)"/>
  
  <!-- Eyes (wide open) -->
  <circle cx="38" cy="36" r="5" fill="currentColor"/>
  <circle cx="62" cy="36" r="5" fill="currentColor"/>
  
  <!-- Blush -->
  <circle cx="32" cy="44" r="2.5" fill="var(--accent, #ff6b2b)" opacity="0.6"/>
  <circle cx="68" cy="44" r="2.5" fill="var(--accent, #ff6b2b)" opacity="0.6"/>
  
  <!-- Mouth (open O) -->
  <ellipse cx="50" cy="50" rx="4" ry="5" fill="none" stroke="currentColor" stroke-width="2.5"/>
  
  <!-- Screen on body (error) -->
  <rect x="30" y="62" width="40" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="50" y="76" text-anchor="middle" font-family="monospace" font-size="10" fill="var(--accent, #ff6b2b)">!</text>
</svg>
