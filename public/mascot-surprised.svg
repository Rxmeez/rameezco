<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Core: plump rounded rect, tilted -->
  <rect x="22" y="25" width="56" height="50" rx="22" fill="none" stroke="currentColor" stroke-width="3" transform="rotate(12 50 50)"/>

  <!-- Top node (raised, alert) -->
  <circle cx="54" cy="8" r="5" fill="currentColor"/>

  <!-- Bottom-left node (shorter) -->
  <circle cx="20" cy="80" r="4" fill="currentColor"/>

  <!-- Bottom-right node -->
  <circle cx="80" cy="76" r="5" fill="currentColor"/>

  <!-- Inner accent (offset, like leaning in) -->
  <circle cx="56" cy="48" r="4" fill="var(--accent, #ff6b2b)" opacity="0.7"/>
</svg>
