<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Head -->
  <rect x="30" y="20" width="60" height="50" rx="4" fill="none" stroke="currentColor" stroke-width="3"/>
  
  <!-- Antenna (with lightbulb idea) -->
  <line x1="60" y1="20" x2="60" y2="8" stroke="currentColor" stroke-width="3"/>
  <circle cx="60" cy="5" r="4" fill="var(--accent, #ff6b2b)" stroke="currentColor" stroke-width="1.5"/>
  
  <!-- Glasses / Eyes (squinting - thinking) -->
  <rect x="38" y="38" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <rect x="64" y="38" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <line x1="56" y1="45" x2="64" y2="45" stroke="currentColor" stroke-width="2.5"/>
  
  <!-- Pupils (looking up) -->
  <circle cx="47" cy="42" r="3" fill="currentColor"/>
  <circle cx="73" cy="42" r="3" fill="currentColor"/>
  
  <!-- Mouth (small hmm line) -->
  <line x1="55" y1="62" x2="65" y2="62" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Body -->
  <rect x="35" y="72" width="50" height="28" rx="3" fill="none" stroke="currentColor" stroke-width="3"/>
  
  <!-- Screen on body (code) -->
  <rect x="42" y="78" width="36" height="16" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <line x1="46" y1="84" x2="56" y2="84" stroke="currentColor" stroke-width="1.5"/>
  <line x1="46" y1="88" x2="62" y2="88" stroke="currentColor" stroke-width="1.5"/>
  
  <!-- Arms (chin stroke pose) -->
  <line x1="35" y1="80" x2="48" y2="92" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="85" y1="80" x2="98" y2="68" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
</svg>
